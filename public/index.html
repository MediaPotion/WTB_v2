<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#060504">
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <title>Wedding Potion — Timeline Builder</title>
  <script>
    (function () {
      var key = 'wtb-theme';
      var theme = 'dark';
      try {
        var stored = localStorage.getItem(key);
        if (stored === 'light' || stored === 'dark') theme = stored;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f5f0e8' : '#060504');
    })();
  </script>
  <style>
    :root, [data-theme="dark"] {
      --wtb-bg: #060504;
      --wtb-surface: #0f0d0b;
      --wtb-surface-raised: #161310;
      --wtb-surface-alt: #1a1714;
      --wtb-border: #2a2520;
      --wtb-text: #ddd0bc;
      --wtb-text-muted: #6e6358;
      --wtb-accent: #b8906a;
      --wtb-cream: #ddd0bc;
    }
    [data-theme="light"] {
      --wtb-bg: #f5f0e8;
      --wtb-surface: #fffdf9;
      --wtb-surface-raised: #efe8dc;
      --wtb-surface-alt: #e8e0d4;
      --wtb-border: #d4c8b8;
      --wtb-text: #1e140a;
      --wtb-text-muted: #6e5c48;
      --wtb-accent: #a67c52;
      --wtb-cream: #1e140a;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; background: var(--wtb-bg, #060504); color: var(--wtb-cream, #ddd0bc); font-family: 'Jost', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--wtb-surface, #0f0d0b); }
    ::-webkit-scrollbar-thumb { background: var(--wtb-border, #2a2520); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--wtb-accent, #b8906a); }
    #grain {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 9999;
      opacity: 0.065; mix-blend-mode: screen;
    }
    @media (max-width: 900px) { #grain { opacity: 0.04; } }
  </style>
</head>
<body>
  <canvas id="grain"></canvas>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script>
    (function() {
      var canvas = document.getElementById('grain');
      var ctx = canvas.getContext('2d');
      var W, H;
      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);
      var last = 0;
      function drawGrain(ts) {
        requestAnimationFrame(drawGrain);
        if (ts - last < 50) return;
        last = ts;
        var img = ctx.createImageData(W, H);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
          var v = (Math.random() * 180) | 0;
          d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }
      requestAnimationFrame(drawGrain);
    })();
  </script>
</body>
</html>
